name: CI Pipeline - Calidad y Pruebas Automatizadas

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  # ---------------------------------------------------------------------------
  # FASE 1: Continuous Integration (Linting y Pruebas Unitarias con PostgreSQL)
  # ---------------------------------------------------------------------------
  test-and-lint:
    name: 🧪 Quality Gates & Pytest
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_password_123
          POSTGRES_DB: bomberos_inventario_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4

      - name: 🐍 Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 📦 Instalar dependencias del Backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest pytest-cov httpx

      - name: 🔍 Verificación Estática y Linting (Ruff)
        run: |
          ruff check .

      - name: 🚦 Ejecución de Pruebas Automatizadas (Pytest)
        env:
          DATABASE_URL: postgresql://postgres:test_password_123@localhost:5432/bomberos_inventario_test
          PYTHONPATH: .
        run: |
          pytest --cov=app --cov-report=term-missing tests/

  # ---------------------------------------------------------------------------
  # FASE 2: Build Verification (Validar Construcción de Contenedores Docker)
  # ---------------------------------------------------------------------------
  docker-build-check:
    name: 🐳 Docker Build Verification
    needs: test-and-lint
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4

      - name: 🔨 Probar Construcción de Imagen Docker
        run: |
          docker compose build
