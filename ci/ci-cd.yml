name: CI/CD Pipeline - Modulo Inventarios Bomberos

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'app-inventario-bomberos/**'
      - '.github/workflows/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'app-inventario-bomberos/**'

jobs:
  # ---------------------------------------------------------------------------
  # FASE 1: Continuous Integration (Linting, Tipado y Pruebas Unitarias)
  # ---------------------------------------------------------------------------
  test-and-lint:
    name: 🧪 Tests & Quality Gates
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_password_123
          POSTGRES_DB: bomberos_inventario_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: ./app-inventario-bomberos/backend

    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4

      - name: 🐍 Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 📦 Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest pytest-cov httpx

      - name: 🔍 Linting y Calidad de Código (Ruff)
        run: |
          ruff check .

      - name: 🚦 Ejecutar Pruebas Automatizadas (Pytest)
        env:
          DATABASE_URL: postgresql://postgres:test_password_123@localhost:5432/bomberos_inventario_test
        run: |
          pytest --cov=app --cov-report=term-missing tests/

  # ---------------------------------------------------------------------------
  # FASE 2: Continuous Deployment (Despliegue Automatico a Render)
  # ---------------------------------------------------------------------------
  deploy-staging:
    name: 🚀 Deploy to Staging (Render Cloud)
    needs: test-and-lint
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: 📢 Notificación de Despliegue Exitoso
        run: |
          echo "Todos los tests de calidad pasaron exitosamente."
          echo "Render detecta el commit en 'main' y aplica Auto-Deploy de inmediato."
