services:
  # Base de Datos PostgreSQL 16
  db:
    image: postgres:16-alpine
    container_name: bomberos_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: bomberos2026_staging_secret
      POSTGRES_DB: bomberos_inventario
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bomberos_inventario"]
      interval: 5s
      timeout: 5s
      retries: 5

  # API REST FastAPI (Backend Python 3.12)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bomberos_backend
    restart: always
    environment:
      - DATABASE_URL=postgresql://postgres:bomberos2026_staging_secret@db:5432/bomberos_inventario
      - SECRET_KEY=bomberos_super_secret_jwt_key_2026_production_grade_security
      - ENVIRONMENT=staging
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/app:/app/app

  # Aplicación Web Vue 3 + Tailwind (Frontend)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bomberos_frontend
    restart: always
    environment:
      - VITE_BACKEND_URL=http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/vite.config.js:/app/vite.config.js

volumes:
  pgdata:
