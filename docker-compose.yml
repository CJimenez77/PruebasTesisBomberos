services:
  db:
    image: postgres:16-alpine
    container_name: bomberos_postgres_staging
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: bomberos2026_staging_secret
      POSTGRES_DB: bomberos_inventario
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bomberos_inventario"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bomberos_fastapi_staging
    restart: always
    environment:
      DB_USER: postgres
      DB_PASSWORD: bomberos2026_staging_secret
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: bomberos_inventario
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/app:/app/app

volumes:
  postgres_data:
    driver: local
