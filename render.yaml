services:
  - type: web
    name: bomberos-inventario-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    rootDir: backend
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: bomberos-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.12.0

databases:
  - name: bomberos-db
    databaseName: bomberos_inventario
    user: bomberos_admin
    plan: free
